upstream api_upstream {
    server api:4010;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite asset filenames mein hash daalta hai, to wo kabhi stale nahi ho sakte.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html cache NAHI hona chahiye, warna deploy ke baad browser purana
    # bundle load karta rahega aur un asset hashes ko maangega jo ab nahi hain.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO
    #
    # Neeche ke do header hi poora lesson hain. Unke bina handshake HTTP
    # long-polling pe chal jata hai - to app kaam karta DIKHTA hai - aur phir
    # WebSocket pe upgrade chupchaap fail hota rehta hai. Realtime app ko proxy
    # ke peeche daalne pe ye sabse common bug hai.
    location /socket.io/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Idle WebSocket nginx ke 60s default pe kat jata hai, isliye lamba timeout.
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }

    # SPA fallback: deep link pe index.html do, routing client side hogi.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
